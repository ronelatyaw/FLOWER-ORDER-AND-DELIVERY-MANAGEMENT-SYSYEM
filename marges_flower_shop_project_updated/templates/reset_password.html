{% extends "customer_base.html" %}
{% block title %}Reset password | Marge's Flower Shop{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="auth-flower">🌸</div>
  <span class="user-eyebrow">SET A NEW PASSWORD</span>
  <h1>Reset your password</h1>
  <p>Choose a new password with at least 8 characters.</p>
  <form method="POST" class="auth-form">
    <label class="form-label" for="password">New password</label>
    <input class="form-control" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <label class="form-label" for="confirm_password">Confirm new password</label>
    <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
    <button class="btn btn-rose w-100" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
