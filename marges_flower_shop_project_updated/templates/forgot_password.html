{% extends "customer_base.html" %}
{% block title %}Forgot password | Marge's Flower Shop{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="auth-flower">✿</div>
  <span class="user-eyebrow">ACCOUNT RECOVERY</span>
  <h1>Forgot your password?</h1>
  <p>Enter the email address connected to your account and we'll send you a secure reset link.</p>
  <form method="POST" class="auth-form">
    <label class="form-label" for="email">Email address</label>
    <input class="form-control" id="email" name="email" type="email" value="{{ email|default('') }}" autocomplete="email" required>
    <button class="btn btn-rose w-100" type="submit">Send reset link</button>
  </form>
  <div class="auth-switch"><a href="{{ url_for('login') }}">Back to log in</a></div>
</section>
{% endblock %}
